name: first workflow
on: 
  push:
  pull_request: 
    branches: 
      - main
      - dev
      - qa
jobs:
  first-jobs:
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v4
        with:
          node-version: 24
          cache: npm
      
      - name: setup nodejs in vm
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: install dependecy
        run: npm ci

      - name: EsLint in app
        run: npm run lint 


      - name: make npm build
        run: npm run build